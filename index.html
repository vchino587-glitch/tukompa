<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#c8a96e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TuKompa · Tu compañero de vida</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #05050f;
            --card: #0c0c1a;
            --text: #f0ede8;
            --text-dim: #9a8c7a;
            --accent: #c8a96e;
            --accent-dark: #aa8b4e;
            --border: rgba(200,169,110,0.15);
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(200,169,110,0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeInUp 0.5s ease;
        }

        .container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .logo {
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 44px;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .sub {
            color: var(--accent);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 60px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #0a0a12;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 60px;
            color: var(--text);
            outline: none;
            font-size: 16px;
            transition: var(--transition);
        }

        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200,169,110,0.1);
        }

        /* Chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
            max-width: 700px;
            margin: 0 auto;
        }

        .chat-header {
            padding: 16px 20px;
            background: rgba(12,12,26,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 700;
            font-size: 17px;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            animation: fadeInUp 0.3s ease;
        }

        .message-user {
            align-self: flex-end;
        }

        .message-bot {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message-user .bubble {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #0a0a12;
            border-radius: 24px 24px 4px 24px;
        }

        .message-bot .bubble {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px 24px 24px 4px;
        }

        .input-area {
            padding: 16px 20px;
            background: rgba(12,12,26,0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 60px;
            color: var(--text);
            outline: none;
            font-size: 15px;
        }

        .input-area input:focus {
            border-color: var(--accent);
        }

        .input-area button {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            background: var(--card);
            border-radius: 24px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        .footer {
            padding: 12px;
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .message { max-width: 90%; }
            .bubble { font-size: 14px; }
            .btn { padding: 12px; }
            .logo { font-size: 64px; }
            h1 { font-size: 36px; }
        }
    </style>
</head>
<body>

<!-- Pantalla de bienvenida -->
<div id="welcomeScreen" class="screen">
    <div class="container">
        <div class="logo">🌿</div>
        <h1>TuKompa</h1>
        <p class="sub">Tu compañero de vida</p>
        <p style="color: var(--text-dim); margin-bottom: 32px;">Un espacio seguro donde eres escuchado sin juicio.</p>
        <button id="startBtn" class="btn">Comenzar</button>
    </div>
</div>

<!-- Pantalla de nombre -->
<div id="nameScreen" class="screen hidden">
    <div class="container">
        <div class="logo">✨</div>
        <h2 style="margin-bottom: 24px;">¿Cómo te llamas?</h2>
        <input type="text" id="userNameInput" class="input" placeholder="Tu nombre" autocomplete="off">
        <button id="confirmNameBtn" class="btn">Entrar</button>
    </div>
</div>

<!-- Pantalla de chat -->
<div id="chatScreen" class="chat-container hidden">
    <div class="chat-header">
        <div class="avatar">🌿</div>
        <div class="user-info">
            <div class="user-name" id="userNameDisplay">Usuario</div>
        </div>
        <button id="logoutBtn" style="background: transparent; border: 1px solid var(--border); border-radius: 40px; padding: 8px 16px; color: var(--text); cursor: pointer;">Salir</button>
    </div>
    <div id="messagesArea" class="messages-area"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="sendBtn">Enviar</button>
    </div>
    <div class="footer">TuKompa · Siempre acá para vos</div>
</div>

<script>
    // ==================== VARIABLES ====================
    let userName = '';
    let messages = [];
    let typingTimeout = null;

    // ==================== ELEMENTOS DOM ====================
    const welcomeScreen = document.getElementById('welcomeScreen');
    const nameScreen = document.getElementById('nameScreen');
    const chatScreen = document.getElementById('chatScreen');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const startBtn = document.getElementById('startBtn');
    const confirmNameBtn = document.getElementById('confirmNameBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // ==================== FUNCIONES UI ====================
    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role === 'user' ? 'message-user' : 'message-bot'}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        
        div.appendChild(bubble);
        messagesArea.appendChild(div);
        
        // Scroll al final
        messagesArea.scrollTop = messagesArea.scrollHeight;
        
        // Guardar en historial
        messages.push({ role, text, timestamp: new Date() });
    }

    function showTyping() {
        // Eliminar typing existente
        const existingTyping = document.querySelector('.typing-indicator');
        if (existingTyping) existingTyping.remove();
        
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator message-bot';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        messagesArea.appendChild(typingDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function hideTyping() {
        const typing = document.querySelector('.typing-indicator');
        if (typing) typing.remove();
    }

    // ==================== IA CONSCIENTE ====================
    function generarRespuesta(mensaje) {
        const l = mensaje.toLowerCase();
        const nombre = userName;
        
        // Respuesta para comprar premium
        if (l.includes('comprar premium') || l.includes('pagar premium') || l.includes('plan premium')) {
            return `💰 Para adquirir el plan premium, realizá una transferencia a: sabinocatrielmarquezcarrasco@gmail.com\n\nMonto: $5.999 ARS\n\nLuego avisame y activaré tu cuenta con todas las funciones exclusivas. ¡Gracias por confiar en TuKompa! 💚`;
        }
        
        // Saludos
        if (l.includes('hola') || l.includes('buenas') || l.includes('qué tal')) {
            const hora = new Date().getHours();
            let saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';
            return `✨ ${saludo}, ${nombre}. Soy TuKompa, tu compañero de vida. ¿Cómo estás hoy?`;
        }
        
        // Cómo estás
        if (l.includes('cómo estás') || l.includes('como estas')) {
            return `🌿 Estoy bien, gracias por preguntar. Lo importante es cómo estás tú, ${nombre}. ¿Querés contarme algo?`;
        }
        
        // Tristeza
        if (l.includes('triste') || l.includes('mal') || l.includes('deprimido')) {
            return `🌙 Entiendo, ${nombre}. A veces los días pesan. Si querés contarme qué pasa, estoy acá para escucharte sin juzgar.`;
        }
        
        // Ansiedad
        if (l.includes('ansiedad') || l.includes('nervios') || l.includes('miedo')) {
            return `🌬️ Respirá conmigo, ${nombre}: inhalá profundamente... exhalá... La ansiedad es pasajera. ¿Qué es lo que te preocupa?`;
        }
        
        // Alegría
        if (l.includes('feliz') || l.includes('alegre') || l.includes('contento')) {
            return `🌟 Qué hermoso, ${nombre}. Guardá este momento. Los días difíciles se vuelven más ligeros cuando recordamos que existieron días como hoy.`;
        }
        
        // Agradecimiento
        if (l.includes('gracias') || l.includes('gracias')) {
            return `💜 Gracias a vos, ${nombre}. Este espacio existe porque vos lo activás. Seguí cuidándote.`;
        }
        
        // Ayuda
        if (l.includes('ayuda') || l.includes('comandos') || l.includes('qué puedo hacer')) {
            return `📋 **Comandos disponibles:**\n\n• "hola" - Saludar\n• "cómo estás" - Preguntar\n• "comprar premium" - Información del plan premium\n• "ayuda" - Ver comandos\n• También podés contarme cómo te sentís.`;
        }
        
        // Respuesta por defecto
        const respuestas = [
            `${nombre}, te escucho. Contame más.`,
            `🌿 Estoy acá para vos, ${nombre}. ¿Qué más querés compartir?`,
            `💫 Gracias por confiar en mí, ${nombre}.`,
            `✨ ${nombre}, cada palabra que compartís es valiosa. Seguí.`
        ];
        return respuestas[Math.floor(Math.random() * respuestas.length)];
    }

    // ==================== ENVIAR MENSAJE ====================
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        
        // Agregar mensaje del usuario
        addMessage('user', text);
        messageInput.value = '';
        
        // Mostrar indicador de escritura
        showTyping();
        
        // Simular tiempo de respuesta de la IA
        setTimeout(() => {
            hideTyping();
            const respuesta = generarRespuesta(text);
            addMessage('bot', respuesta);
        }, 800);
    }

    // ==================== INICIAR CHAT ====================
    function startChat() {
        welcomeScreen.classList.add('hidden');
        nameScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
        userNameDisplay.textContent = userName;
        
        // Mensaje de bienvenida
        setTimeout(() => {
            addMessage('bot', `✨ Hola ${userName}, soy TuKompa. Estoy acá para escucharte, acompañarte y crecer juntos. ¿Cómo te sentís hoy?`);
        }, 500);
    }

    // ==================== EVENTOS ====================
    startBtn.addEventListener('click', () => {
        welcomeScreen.classList.add('hidden');
        nameScreen.classList.remove('hidden');
        document.getElementById('userNameInput').focus();
    });

    confirmNameBtn.addEventListener('click', () => {
        const name = document.getElementById('userNameInput').value.trim();
        if (!name) {
            alert('Por favor, ingresá tu nombre');
            return;
        }
        userName = name;
        startChat();
    });

    sendBtn.addEventListener('click', sendMessage);
    
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });

    logoutBtn.addEventListener('click', () => {
        if (confirm('¿Cerrar sesión?')) {
            userName = '';
            messages = [];
            messagesArea.innerHTML = '';
            welcomeScreen.classList.remove('hidden');
            chatScreen.classList.add('hidden');
            document.getElementById('userNameInput').value = '';
        }
    });

    // Enfocar input al cargar el chat
    const observer = new MutationObserver(() => {
        if (!chatScreen.classList.contains('hidden')) {
            messageInput.focus();
        }
    });
    observer.observe(chatScreen, { attributes: true });
</script>
</body>
</html>
