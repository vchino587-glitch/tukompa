<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuKompa</title>
    <style>
        body{font-family:Arial;background:#05050f;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .container{max-width:400px;text-align:center;padding:20px}
        .logo{font-size:72px}
        h1{color:#c8a96e}
        .btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:40px;border:none;font-size:16px;font-weight:bold;cursor:pointer;background:#c8a96e;color:#05050f}
        .input{width:100%;padding:14px;margin:10px 0;border-radius:40px;border:1px solid #c8a96e;background:#1a1a2a;color:#fff}
        .hidden{display:none}
        .chat-area{background:#0c0c1a;border-radius:20px;padding:20px;height:400px;display:flex;flex-direction:column}
        .messages{flex:1;overflow-y:auto;margin-bottom:10px}
        .message{padding:8px 12px;margin:5px 0;border-radius:10px;max-width:80%}
        .user{background:#c8a96e;color:#05050f;margin-left:auto}
        .bot{background:#1a1a2a}
        .input-area{display:flex;gap:10px}
        .input-area input{flex:1;padding:10px;border-radius:40px;border:1px solid #2a2a3a;background:#1a1a2a;color:#fff}
        .input-area button{padding:10px 20px;background:#c8a96e;border:none;border-radius:40px;font-weight:bold;cursor:pointer}
    </style>
</head>
<body>

<div id="welcome">
    <div class="container">
        <div class="logo">🌿</div>
        <h1>TuKompa</h1>
        <p>Tu compañero de vida</p>
        <button class="btn" onclick="mostrarNombre()">Comenzar</button>
    </div>
</div>

<div id="nombreScreen" class="hidden">
    <div class="container">
        <h2>¿Cómo te llamas?</h2>
        <input type="text" id="nombreInput" class="input" placeholder="Tu nombre">
        <button class="btn" onclick="iniciarChat()">Entrar</button>
    </div>
</div>

<div id="chat" class="hidden">
    <div class="container">
        <h1 id="nombreUsuario">TuKompa</h1>
        <div class="chat-area">
            <div class="messages" id="mensajes"></div>
            <div class="input-area">
                <input type="text" id="mensajeInput" placeholder="Escribe un mensaje...">
                <button onclick="enviar()">Enviar</button>
            </div>
        </div>
    </div>
</div>

<script>
    let usuario = '';

    function mostrarNombre() {
        document.getElementById('welcome').classList.add('hidden');
        document.getElementById('nombreScreen').classList.remove('hidden');
    }

    function iniciarChat() {
        let nombre = document.getElementById('nombreInput').value.trim();
        if (nombre === '') return alert('Escribe tu nombre');
        usuario = nombre;
        document.getElementById('nombreUsuario').innerHTML = `Hola ${usuario}`;
        document.getElementById('nombreScreen').classList.add('hidden');
        document.getElementById('chat').classList.remove('hidden');
        agregarMensaje('bot', `✨ Hola ${usuario}, soy TuKompa.`);
    }

    function agregarMensaje(quien, texto) {
        let area = document.getElementById('mensajes');
        let div = document.createElement('div');
        div.className = `message ${quien}`;
        div.innerHTML = `<strong>${quien === 'user' ? 'Tú' : 'TuKompa'}</strong><br>${texto}`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    async function enviar() {
        let input = document.getElementById('mensajeInput');
        let texto = input.value.trim();
        if (texto === '') return;

        agregarMensaje('user', texto);
        input.value = '';

        setTimeout(async () => {
            let l = texto.toLowerCase();

            if (l.includes('comprar premium')) {
                agregarMensaje('bot', "🔄 Procesando pago...");
                try {
                    let res = await fetch('/api/mercadopago', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ plan: 'premium', email: 'usuario@ejemplo.com', nombre: usuario })
                    });
                    let data = await res.json();
                    if (data.init_point) {
                        window.open(data.init_point, '_blank');
                        agregarMensaje('bot', "💰 Abriendo MercadoPago");
                    } else {
                        agregarMensaje('bot', "❌ Error en el pago");
                    }
                } catch (e) {
                    agregarMensaje('bot', "❌ Error de conexión");
                }
                return;
            }

            let respuesta = l.includes('hola') ? `✨ Hola ${usuario}` : `🌿 Te escucho, ${usuario}.`;
            agregarMensaje('bot', respuesta);
        }, 500);
    }
</script>
</body>
</html>
