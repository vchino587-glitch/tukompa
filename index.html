<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TuKompa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg:        #060B18;
      --bg2:       #0d1528;
      --bg3:       #111e38;
      --gold:      #c8a96e;
      --gold-dim:  #9a7d4e;
      --gold-glow: rgba(200,169,110,0.15);
      --text:      #e8dfd0;
      --text-dim:  #8a7f70;
      --border:    rgba(200,169,110,0.18);
      --radius:    14px;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'Outfit', sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top:    env(safe-area-inset-top, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 16px;
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    .screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; transition: opacity 0.4s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }

    /* CARGA */
    #screen-loading { background: var(--bg); gap: 16px; }
    .loading-logo {
      font-family: var(--font-serif); font-size: 44px; font-weight: 300;
      color: var(--gold); opacity: 0; animation: fadeUp 0.6s ease 0.2s forwards;
    }
    .loading-dots { display: flex; gap: 6px; opacity: 0; animation: fadeUp 0.4s ease 0.6s forwards; }
    .loading-dots span {
      width: 6px; height: 6px; background: var(--gold-dim);
      border-radius: 50%; animation: pulse 1.2s ease infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* LOGIN */
    #screen-login { background: var(--bg); padding: 40px 28px; }
    #screen-login::before {
      content: ''; position: absolute; top: -120px; left: 50%;
      transform: translateX(-50%); width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(200,169,110,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-logo {
      font-family: var(--font-serif); font-size: 52px; font-weight: 300;
      color: var(--gold); letter-spacing: 0.04em; line-height: 1; margin-bottom: 6px;
    }
    .login-tagline {
      font-family: var(--font-serif); font-style: italic; font-size: 17px;
      color: var(--text-dim); letter-spacing: 0.02em; margin-bottom: 52px;
    }
    .login-card {
      width: 100%; max-width: 360px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .login-card h2 {
      font-family: var(--font-serif); font-weight: 400; font-size: 22px;
      color: var(--text); text-align: center;
    }
    .login-card > p { font-size: 14px; color: var(--text-dim); text-align: center; line-height: 1.6; }
    #btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 14px 20px; background: transparent;
      border: 1px solid var(--gold); border-radius: var(--radius); color: var(--gold);
      font-family: var(--font-sans); font-size: 15px; font-weight: 500;
      letter-spacing: 0.03em; cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s; -webkit-tap-highlight-color: transparent;
    }
    #btn-google:active { background: var(--gold-glow); box-shadow: 0 0 20px var(--gold-glow); }
    #btn-google .btn-spinner {
      width: 18px; height: 18px; border: 2px solid var(--gold-dim);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    #btn-google.loading .btn-spinner { display: block; }
    #btn-google.loading .btn-icon,
    #btn-google.loading .btn-label { display: none; }
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--text-dim); font-size: 12px; letter-spacing: 0.05em;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .login-privacy { font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.5; }
    #login-error {
      font-size: 13px; color: #e07070; text-align: center; display: none;
      padding: 10px 14px; background: rgba(220,70,70,0.08);
      border-radius: 10px; border: 1px solid rgba(220,70,70,0.2);
    }
    #login-error.visible { display: block; }

    /* CHAT */
    #screen-chat {
      flex-direction: column; justify-content: flex-start;
      background: var(--bg); padding: 0; padding-top: var(--safe-top);
    }
    .chat-header {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      background: rgba(6,11,24,0.85); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); flex-shrink: 0; z-index: 10;
    }
    .header-brand {
      font-family: var(--font-serif); font-size: 24px; font-weight: 300;
      color: var(--gold); letter-spacing: 0.03em;
    }
    .header-user { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1.5px solid var(--gold-dim); object-fit: cover; background: var(--bg3);
    }
    .user-name {
      font-size: 13px; color: var(--text-dim);
      max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #btn-logout {
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 10px; color: var(--text-dim); font-family: var(--font-sans);
      font-size: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #btn-logout:active { color: var(--gold); border-color: var(--gold-dim); }
    #messages {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
      -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
    }
    .messages-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: var(--text-dim); padding: 40px 20px; text-align: center;
    }
    .messages-empty .empty-icon { font-size: 36px; opacity: 0.4; }
    .messages-empty h3 {
      font-family: var(--font-serif); font-weight: 400; font-size: 22px; color: var(--text);
    }
    .messages-empty p { font-size: 14px; line-height: 1.6; max-width: 280px; }
    .message { display: flex; flex-direction: column; max-width: 85%; animation: msgIn 0.25s ease; }
    .message.user      { align-self: flex-end;   align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }
    .message-bubble {
      padding: 11px 15px; border-radius: 16px; font-size: 15px;
      line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .message.user .message-bubble {
      background: var(--gold); color: #060B18; border-bottom-right-radius: 4px;
    }
    .message.assistant .message-bubble {
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .message-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; padding: 0 4px; }
    .typing-indicator {
      display: flex; align-items: center; gap: 5px; padding: 12px 16px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content;
    }
    .typing-indicator span {
      width: 7px; height: 7px; background: var(--gold-dim);
      border-radius: 50%; animation: pulse 1.2s ease infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    .chat-input-area {
      width: 100%; padding: 12px 14px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border); background: rgba(6,11,24,0.9);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); flex-shrink: 0;
    }
    .input-row { display: flex; align-items: flex-end; gap: 10px; max-width: 700px; margin: 0 auto; }
    #user-input {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 20px; padding: 12px 16px; color: var(--text);
      font-family: var(--font-sans); font-size: 15px; resize: none; outline: none;
      max-height: 120px; min-height: 46px; line-height: 1.5;
      -webkit-appearance: none; transition: border-color 0.2s;
    }
    #user-input::placeholder { color: var(--text-dim); }
    #user-input:focus { border-color: var(--gold-dim); }
    #btn-send {
      width: 46px; height: 46px; border-radius: 50%; background: var(--gold);
      border: none; cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.2s, transform 0.15s;
    }
    #btn-send:active { transform: scale(0.92); }
    #btn-send:disabled { opacity: 0.4; }
    #btn-send svg { color: #060B18; }
    .chat-actions { display: flex; justify-content: center; padding: 6px 0 0; }
    #btn-clear {
      background: transparent; border: none; color: var(--text-dim);
      font-family: var(--font-sans); font-size: 12px; cursor: pointer;
      padding: 4px 8px; -webkit-tap-highlight-color: transparent; opacity: 0.6;
    }
    #btn-clear:active { opacity: 1; color: var(--gold); }

    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,80%,100%{transform:scale(0.7);opacity:.5} 40%{transform:scale(1);opacity:1} }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>

</head>
<body>

  <div id="screen-loading" class="screen">
    <div class="loading-logo">TuKompa</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <div id="screen-login" class="screen hidden">
    <div class="login-logo">TuKompa</div>
    <p class="login-tagline">Tu compañero de conversación</p>
    <div class="login-card">
      <h2>Bienvenido de vuelta</h2>
      <p>Inicia sesión para acceder a tus conversaciones y continuar donde lo dejaste.</p>
      <div id="login-error"></div>
      <button id="btn-google" onclick="signInWithGoogle()">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.1-6.1C34.43 3.01 29.48 1 24 1 14.72 1 6.77 6.56 3.1 14.5l7.08 5.5C12.03 13.5 17.56 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.14-3.14-.4-4.62H24v8.75h12.67c-.55 2.9-2.2 5.36-4.67 7.02l7.19 5.58C43.42 37.36 46.5 31.38 46.5 24.5z"/>
          <path fill="#FBBC05" d="M10.18 28.5A14.6 14.6 0 0 1 9.5 24c0-1.57.27-3.09.68-4.5L3.1 14c-1.35 2.72-2.1 5.77-2.1 9S1.75 30.28 3.1 33l7.08-5.5z"/>
          <path fill="#34A853" d="M24 47c5.48 0 10.09-1.82 13.45-4.95l-7.19-5.58c-1.87 1.25-4.26 1.98-6.26 1.98-6.44 0-11.97-4-13.82-9.5L3.1 34c3.67 7.94 11.62 13 20.9 13z"/>
        </svg>
        <div class="btn-spinner"></div>
        <span class="btn-label">Continuar con Google</span>
      </button>
      <div class="login-divider">privacidad</div>
      <p class="login-privacy">Solo usamos tu nombre y correo de Google para personalizar tu experiencia. Nunca compartimos tu información.</p>
    </div>
  </div>

  <div id="screen-chat" class="screen hidden">
    <div class="chat-header">
      <div class="header-brand">TuKompa</div>
      <div class="header-user">
        <img id="user-avatar" class="user-avatar" src="" alt="" onerror="this.style.display='none'" />
        <span id="user-display-name" class="user-name"></span>
        <button id="btn-logout" onclick="signOut()">Salir</button>
      </div>
    </div>
    <div id="messages"></div>
    <div class="chat-input-area">
      <div class="input-row">
        <textarea id="user-input" placeholder="Escribe tu mensaje…" rows="1"
          autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true"></textarea>
        <button id="btn-send" onclick="sendMessage()" aria-label="Enviar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
          </svg>
        </button>
      </div>
      <div class="chat-actions">
        <button id="btn-clear" onclick="clearHistory()">Limpiar conversación</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyCO5hNAkEaFq0Hqs8iBJD1gkVM3hFbpv2g",
      authDomain:        "tukompa-9b4c9.firebaseapp.com",
      projectId:         "tukompa-9b4c9",
      storageBucket:     "tukompa-9b4c9.firebasestorage.app",
      messagingSenderId: "66913833177",
      appId:             "1:66913833177:web:f00203bf49246f7dbeaec8",
      measurementId:     "G-PEB0RCJ8GF"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    let currentUser         = null;
    let conversationHistory = [];
    let isTyping            = false;

    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('user-input');
    const sendBtn    = document.getElementById('btn-send');
    const loginError = document.getElementById('login-error');

    const LS_KEY = 'tk_pending_redirect'; // localStorage key

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById('screen-' + name).classList.remove('hidden');
    }

    function showLoginError(msg) {
      loginError.textContent = msg;
      loginError.classList.add('visible');
    }

    /* ══════════════════════════════════════════════════════
       ARRANQUE
       Secuencia correcta para iOS Safari:
       1. Limpiar cualquier estado anterior
       2. Llamar getRedirectResult() PRIMERO y esperar
       3. Si hay usuario → chat
       4. Si no hay resultado de redirect → onAuthStateChanged decide
       5. localStorage persiste a través del redirect (a diferencia de sessionStorage)
    ══════════════════════════════════════════════════════ */
    async function init() {
      try {
        // ¿Venimos de un redirect de Google?
        const pendingRedirect = localStorage.getItem(LS_KEY);

        const result = await auth.getRedirectResult();
        localStorage.removeItem(LS_KEY); // limpiar siempre

        if (result && result.user) {
          // Login via redirect exitoso
          await enterChat(result.user);
          return;
        }

        if (pendingRedirect) {
          // Veníamos de redirect pero no hay resultado — algo falló
          // Esperar a onAuthStateChanged por si el usuario ya estaba logeado
        }

        // Escuchar estado de sesión existente
        auth.onAuthStateChanged(async (user) => {
          if (user) {
            await enterChat(user);
          } else {
            showScreen('login');
          }
        });

      } catch (err) {
        console.error('init error:', err);
        localStorage.removeItem(LS_KEY);
        auth.onAuthStateChanged(async (user) => {
          if (user) { await enterChat(user); }
          else { showScreen('login'); }
        });
      }
    }

    init();

    async function enterChat(user) {
      currentUser = user;
      await setupChat(user);
      showScreen('chat');
    }

    /* ══ SIGN IN ══════════════════════════════════════════ */
    function signInWithGoogle() {
      const btn = document.getElementById('btn-google');
      btn.classList.add('loading');
      btn.disabled = true;
      loginError.classList.remove('visible');

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('profile');
      provider.addScope('email');
      provider.setCustomParameters({ prompt: 'select_account' });

      // Marcar ANTES de redirigir — localStorage persiste entre páginas en iOS Safari
      localStorage.setItem(LS_KEY, '1');

      auth.signInWithRedirect(provider).catch(err => {
        localStorage.removeItem(LS_KEY);
        btn.classList.remove('loading');
        btn.disabled = false;
        showLoginError('Error al iniciar sesión. Intenta de nuevo.');
        console.error(err);
      });
    }

    function signOut() {
      auth.signOut().then(() => {
        currentUser = null;
        conversationHistory = [];
        messagesEl.innerHTML = '';
        localStorage.removeItem(LS_KEY);
        showScreen('login');
      });
    }

    /* ══ SETUP CHAT ═══════════════════════════════════════ */
    async function setupChat(user) {
      const firstName = user.displayName ? user.displayName.split(' ')[0] : 'Usuario';
      document.getElementById('user-display-name').textContent = firstName;
      const avatarEl = document.getElementById('user-avatar');
      if (user.photoURL) { avatarEl.src = user.photoURL; avatarEl.style.display = 'block'; }
      else { avatarEl.style.display = 'none'; }
      await loadHistory(user.uid);
      scrollToBottom();
    }

    /* ══ FIRESTORE ════════════════════════════════════════ */
    async function loadHistory(uid) {
      messagesEl.innerHTML = '';
      conversationHistory = [];
      try {
        const doc = await db.collection('chats').doc(uid).get();
        if (doc.exists) {
          const msgs = doc.data().messages || [];
          conversationHistory = msgs.map(m => ({ role: m.role, content: m.content }));
          const visible = msgs.slice(-60);
          visible.length === 0
            ? renderEmptyState()
            : visible.forEach(m => renderMessage(m.role, m.content, m.timestamp, false));
        } else {
          renderEmptyState();
        }
      } catch (err) {
        console.error('loadHistory:', err);
        renderEmptyState();
      }
    }

    async function saveHistory() {
      if (!currentUser) return;
      try {
        await db.collection('chats').doc(currentUser.uid).set({
          messages:  conversationHistory.slice(-100),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          userName:  currentUser.displayName || '',
          userEmail: currentUser.email || ''
        });
      } catch (err) { console.error('saveHistory:', err); }
    }

    async function clearHistory() {
      if (!currentUser || !confirm('¿Borrar toda la conversación?')) return;
      conversationHistory = [];
      messagesEl.innerHTML = '';
      renderEmptyState();
      try { await db.collection('chats').doc(currentUser.uid).delete(); }
      catch (err) { console.error('clearHistory:', err); }
    }

    /* ══ RENDER ═══════════════════════════════════════════ */
    function renderEmptyState() {
      const n = currentUser?.displayName ? ', ' + currentUser.displayName.split(' ')[0] : '';
      messagesEl.innerHTML = `
        <div class="messages-empty">
          <div class="empty-icon">💬</div>
          <h3>Hola${n}</h3>
          <p>Soy TuKompa, tu compañero de conversación. ¿En qué puedo ayudarte hoy?</p>
        </div>`;
    }

    function renderMessage(role, content, timestamp, animate = true) {
      const empty = messagesEl.querySelector('.messages-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      div.className = `message ${role}`;
      const time = timestamp
        ? new Date(timestamp).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
        : '';
      div.innerHTML = `
        <div class="message-bubble">${escapeHtml(content)}</div>
        ${time ? `<div class="message-meta">${time}</div>` : ''}`;
      if (!animate) div.style.animation = 'none';
      messagesEl.appendChild(div);
    }

    function renderTyping() {
      const div = document.createElement('div');
      div.id = 'typing-bubble'; div.className = 'message assistant';
      div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      messagesEl.appendChild(div); scrollToBottom();
    }

    function removeTyping() {
      const el = document.getElementById('typing-bubble');
      if (el) el.remove();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
    }

    function escapeHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ══ ENVIAR ═══════════════════════════════════════════ */
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isTyping || !currentUser) return;

      isTyping = true; sendBtn.disabled = true;
      inputEl.value = ''; inputEl.style.height = 'auto';

      const ts = Date.now();
      renderMessage('user', text, ts); scrollToBottom();
      conversationHistory.push({ role: 'user', content: text, timestamp: ts });
      renderTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-User-Id':    currentUser.uid,
            'X-User-Name':  encodeURIComponent(currentUser.displayName || 'Usuario')
          },
          body: JSON.stringify({
            messages: conversationHistory.map(m => ({ role: m.role, content: m.content })),
            userId:   currentUser.uid,
            userName: currentUser.displayName || 'Usuario'
          })
        });
        if (!res.ok) throw new Error(`API ${res.status}`);
        const data  = await res.json();
        const reply = data.reply || data.message || data.content || 'Sin respuesta';

        removeTyping();
        const replyTs = Date.now();
        renderMessage('assistant', reply, replyTs); scrollToBottom();
        conversationHistory.push({ role: 'assistant', content: reply, timestamp: replyTs });
        await saveHistory();

      } catch (err) {
        removeTyping();
        renderMessage('assistant', 'Hubo un error al conectar. Intenta de nuevo.', Date.now());
        scrollToBottom(); console.error(err);
      } finally {
        isTyping = false; sendBtn.disabled = false; inputEl.focus();
      }
    }

    /* ══ TEXTAREA ═════════════════════════════════════════ */
    inputEl.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    inputEl.addEventListener('focus', () => setTimeout(() => scrollToBottom(), 350));

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        const offset = window.innerHeight - window.visualViewport.height;
        document.querySelector('.chat-input-area').style.transform = `translateY(-${offset}px)`;
        scrollToBottom();
      });
    }
  </script>

</body>
</html>
