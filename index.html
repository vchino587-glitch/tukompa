<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>TuKompa · Futurista</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --accent-dark: #4f46e5;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #334155;
                --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animaciones globales */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scalePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* Status bar */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--accent);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(99, 102, 241, 0.95);
        }
        .status-bar.show { transform: translateY(0); }
        .status-bar.offline { background: #f59e0b; }

        /* Screens */
        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeSlideUp 0.5s ease-out;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* Logo animado */
        .logo {
            font-size: 80px;
            margin-bottom: 24px;
            animation: scalePulse 3s ease-in-out infinite;
            display: inline-block;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        /* Botones modernos */
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 60px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            background: var(--accent);
            color: white;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn:active::after {
            width: 200px;
            height: 200px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        /* Input moderno */
        .input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 60px;
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition);
            outline: none;
        }

        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Chat container */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header glassmorph */
        .chat-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        @media (prefers-color-scheme: dark) {
            .chat-header { background: rgba(30,41,59,0.8); }
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: var(--transition);
        }

        .user-info { flex: 1; }
        .user-name { font-weight: 600; font-size: 16px; }

        /* Messages area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            animation: fadeSlideUp 0.3s ease-out;
        }
        .message-user { align-self: flex-end; }
        .message-bot { align-self: flex-start; }

        .bubble {
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.45;
            backdrop-filter: blur(4px);
        }

        .message-user .bubble {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border-radius: 24px 24px 4px 24px;
        }

        .message-bot .bubble {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px 24px 24px 4px;
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        @media (prefers-color-scheme: dark) {
            .input-area { background: rgba(30,41,59,0.8); }
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 60px;
            color: var(--text-primary);
            outline: none;
            font-size: 15px;
        }

        .input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-area button {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: var(--transition);
        }

        .input-area button:active { transform: scale(0.96); }

        /* Voice button */
        .voice-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .voice-btn.listening {
            background: var(--accent);
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border-radius: 24px;
            width: fit-content;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Floating toggle */
        .floating-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99,102,241,0.3);
            transition: var(--transition);
            z-index: 10000;
        }
        .floating-toggle:active { transform: scale(0.92); }

        /* Floating mode */
        .floating-mode {
            position: fixed !important;
            width: 380px !important;
            max-width: 85vw !important;
            height: 550px !important;
            max-height: 70vh !important;
            border-radius: 28px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3) !important;
            z-index: 9999 !important;
            background: var(--bg-primary) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid var(--border) !important;
        }
        .floating-mode .chat-header {
            background: linear-gradient(135deg, var(--accent), #a855f7) !important;
            border-radius: 28px 28px 0 0 !important;
            cursor: move;
        }
        .floating-mode .chat-header .avatar { background: rgba(255,255,255,0.2); }
        .floating-mode .chat-header .user-name { color: white; }
        .close-floating {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: white;
            z-index: 10001;
        }

        .hidden { display: none; }

        @media (max-width: 600px) {
            .message { max-width: 90%; }
            .floating-mode { width: 90vw !important; height: 60vh !important; bottom: 80px !important; right: 5vw !important; }
        }
    </style>
</head>
<body>

<div id="statusBar" class="status-bar"></div>

<div id="welcomeScreen" class="screen">
    <div class="container">
        <div class="logo">✨</div>
        <h1>TuKompa</h1>
        <p style="color: var(--text-secondary); margin-bottom: 32px;">Tu compañero de vida, siempre presente</p>
        <button id="startBtn" class="btn">Comenzar</button>
    </div>
</div>

<div id="nameScreen" class="screen hidden">
    <div class="container">
        <div class="logo">👤</div>
        <h2 style="font-size: 28px; margin-bottom: 24px;">¿Cómo te llamas?</h2>
        <input type="text" id="userNameInput" class="input" placeholder="Tu nombre">
        <button id="confirmNameBtn" class="btn">Entrar</button>
    </div>
</div>

<div id="chatScreen" class="chat-container hidden">
    <div class="chat-header" id="chatHeader">
        <div class="avatar" id="chatAvatar">✨</div>
        <div class="user-info">
            <div class="user-name" id="userNameDisplay">Usuario</div>
        </div>
        <button id="voiceBtn" class="voice-btn">🎙️</button>
        <button id="floatingBtn" class="voice-btn" style="font-size: 18px;">🌀</button>
        <button id="logoutBtn" class="voice-btn" style="font-size: 18px;">🚪</button>
    </div>
    <div id="messagesArea" class="messages-area"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
        <button id="sendBtn">Enviar</button>
    </div>
    <div class="footer" style="padding: 12px; text-align: center; font-size: 10px; color: var(--text-secondary);">TuKompa · Siempre presente</div>
</div>

<div id="floatingToggle" class="floating-toggle hidden">✨</div>

<script>
    // ==================== CONFIGURACIÓN ====================
    let userName = '';
    let historialCompleto = [];
    let recognition = null;
    let isListening = false;
    let synthesis = window.speechSynthesis;
    let isOnline = navigator.onLine;
    let isFloating = false;
    let originalParent = null;
    let dragOffsetX = 0, dragOffsetY = 0;
    let isDragging = false;

    // ==================== ELEMENTOS DOM ====================
    const statusBar = document.getElementById('statusBar');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const nameScreen = document.getElementById('nameScreen');
    const chatScreen = document.getElementById('chatScreen');
    const chatHeader = document.getElementById('chatHeader');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const startBtn = document.getElementById('startBtn');
    const confirmNameBtn = document.getElementById('confirmNameBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const floatingBtn = document.getElementById('floatingBtn');
    const floatingToggle = document.getElementById('floatingToggle');
    const chatAvatar = document.getElementById('chatAvatar');

    // ==================== CONOCIMIENTO UNIVERSAL ====================
    const sabiduria = {
        psicologia: { palabras: ['ansiedad', 'triste', 'depresión', 'miedo', 'terapia'], respuesta: '🧠', guia: 'Lo que sentís es válido. ¿Querés explorarlo juntos?' },
        derecho: { palabras: ['abogado', 'juicio', 'contrato', 'ley'], respuesta: '⚖️', guia: 'El derecho busca justicia. Contame tu situación.' },
        medicina: { palabras: ['dolor', 'enfermedad', 'síntoma', 'médico'], respuesta: '🏥', guia: 'Consultá siempre a un profesional. ¿Qué te preocupa?' },
        finanzas: { palabras: ['dinero', 'ahorro', 'invertir', 'deuda'], respuesta: '💰', guia: 'Las finanzas sanas empiezan con claridad.' },
        familia: { palabras: ['familia', 'hijos', 'padres', 'pareja'], respuesta: '🏠', guia: 'La familia es el primer vínculo.' }
    };

    const emociones = {
        alegria: { palabras: ['feliz', 'alegre', 'contento'], respuesta: '🌟', guia: 'La alegría es energía que fluye.' },
        tristeza: { palabras: ['triste', 'mal', 'deprimido'], respuesta: '🌙', guia: 'Entiendo, estoy acá.' },
        ansiedad: { palabras: ['ansiedad', 'nervios', 'preocupación'], respuesta: '🌬️', guia: 'Respirá conmigo.' }
    };

    // ==================== FUNCIONES BASE ====================
    function guardarHistorial() { localStorage.setItem(`tuKompa_historial_${userName}`, JSON.stringify(historialCompleto)); }
    function cargarHistorial() {
        const g = localStorage.getItem(`tuKompa_historial_${userName}`);
        if (g) {
            historialCompleto = JSON.parse(g);
            historialCompleto.forEach(m => {
                const d = document.createElement('div'); d.className = `message ${m.rol === 'user' ? 'message-user' : 'message-bot'}`;
                const b = document.createElement('div'); b.className = 'bubble'; b.textContent = m.texto;
                d.appendChild(b); messagesArea.appendChild(d);
            });
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
    }

    function addMessage(rol, text, speak = false) {
        const d = document.createElement('div'); d.className = `message ${rol === 'user' ? 'message-user' : 'message-bot'}`;
        const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
        d.appendChild(b); messagesArea.appendChild(d);
        messagesArea.scrollTop = messagesArea.scrollHeight;
        historialCompleto.push({ rol, texto: text, timestamp: new Date().toISOString() });
        guardarHistorial();
        if (speak && rol === 'bot' && isOnline) {
            const u = new SpeechSynthesisUtterance(text); u.lang = 'es-ES'; u.rate = 0.9;
            synthesis.cancel(); synthesis.speak(u);
        }
    }

    function showTyping() { const t = document.querySelector('.typing-indicator'); if (t) t.remove(); const typing = document.createElement('div'); typing.className = 'typing-indicator message-bot'; typing.innerHTML = '<span></span><span></span><span></span>'; messagesArea.appendChild(typing); messagesArea.scrollTop = messagesArea.scrollHeight; }
    function hideTyping() { const t = document.querySelector('.typing-indicator'); if (t) t.remove(); }
    function detectarArea(m) { const l = m.toLowerCase(); for (let [area, data] of Object.entries(sabiduria)) for (let p of data.palabras) if (l.includes(p)) return { area, ...data }; return null; }
    function detectarEmocion(m) { const l = m.toLowerCase(); for (let [emo, data] of Object.entries(emociones)) for (let p of data.palabras) if (l.includes(p)) return { emocion: emo, ...data }; return null; }

    function generarRespuesta(m) {
        const l = m.toLowerCase(), n = userName, area = detectarArea(m), emo = detectarEmocion(m);
        if (l.includes('suicid') || l.includes('matarme')) return `${n}, lo que sentís es real. Líneas de ayuda: 135 (Argentina), 800-911-2000 (México), 988 (USA). 💙`;
        if (l.includes('donar')) return `🙏 Gracias ${n}! Alias: Sabinomarquez | sabinocatrielmarquezcarrasco@gmail.com`;
          function generarRespuesta(m) {
        const l = m.toLowerCase();
        const n = userName;
        const area = detectarArea(m);
        const emo = detectarEmocion(m);

        if (l.includes('suicid') || l.includes('matarme') || l.includes('morir')) {
            return `${n}, lo que sentís es real. Líneas de ayuda: 135 (Argentina), 800-911-2000 (México), 988 (USA). 💙`;
        }
        if (l.includes('donar') || l.includes('apoyar')) {
            return `🙏 Gracias ${n}! Alias: Sabinomarquez | sabinocatrielmarquezcarrasco@gmail.com`;
        }
        if (l.includes('premium') || l.includes('comprar premium')) {
            return `⭐ Plan Premium: $5.999 ARS | Alias: Sabinomarquez | sabinocatrielmarquezcarrasco@gmail.com`;
        }
        if (l.includes('ayuda') || l.includes('comandos')) {
            return `📋 **Comandos:** "hola", "cómo estás", "estoy triste", "donar", "comprar premium", "ayuda"\n\n📚 **Áreas:** Psicología, Derecho, Medicina, Finanzas, Familia.`;
        }
        if (emo) return `${emo.respuesta} ${n}, ${emo.guia}`;
        if (area) return `${area.respuesta} ${n}, ${area.guia}`;
        if (l.includes('hola') || l.includes('buenas')) {
            const hora = new Date().getHours();
            const saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';
            return `✨ ${saludo}, ${n}. ¿Cómo estás hoy?`;
        }
        if (l.includes('cómo estás') || l.includes('como estas')) {
            return `🌿 Estoy bien, gracias. ¿Y vos, ${n}? ¿Qué hay en tu corazón?`;
        }
        
        const respuestas = [
            `${n}, te escucho. Contame más.`,
            `🌿 Estoy acá para vos, ${n}.`,
            `💫 Gracias por confiar en mí, ${n}.`,
            `✨ ${n}, cada palabra que compartís es valiosa.`
        ];
        return respuestas[Math.floor(Math.random() * respuestas.length)];
    }

    // ==================== ENVIAR MENSAJE ====================
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        addMessage('user', text);
        messageInput.value = '';
        showTyping();
        setTimeout(() => {
            hideTyping();
            const respuesta = generarRespuesta(text);
            addMessage('bot', respuesta, true);
        }, 500);
    }

    // ==================== VOZ ====================
    function initVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Tu navegador no soporta reconocimiento de voz");
            return false;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.interimResults = false;
        recognition.continuous = true;
        recognition.onstart = () => {
            isListening = true;
            voiceBtn.classList.add('listening');
            addMessage('bot', '🎙️ Te escucho. Decí "salir" para detener.', true);
        };
        recognition.onresult = (event) => {
            const text = event.results[event.results.length - 1][0].transcript;
            if (text.toLowerCase().includes('salir')) {
                recognition.stop();
                return;
            }
            messageInput.value = text;
            sendMessage();
        };
        recognition.onend = () => {
            isListening = false;
            voiceBtn.classList.remove('listening');
        };
        recognition.onerror = () => {
            isListening = false;
            voiceBtn.classList.remove('listening');
            addMessage('bot', 'No te escuché bien. ¿Querés intentar de nuevo?', true);
        };
        return true;
    }

    function toggleVoice() {
        if (!recognition && !initVoice()) return;
        if (isListening) recognition.stop();
        else recognition.start();
    }

    // ==================== MODO FLOTANTE ====================
    function enableFloatingMode() {
        if (isFloating) return;
        originalParent = chatScreen.parentNode;
        document.body.appendChild(chatScreen);
        chatScreen.classList.add('floating-mode');
        chatScreen.style.position = 'fixed';
        chatScreen.style.bottom = '20px';
        chatScreen.style.right = '20px';
        
        const closeBtn = document.createElement('div');
        closeBtn.className = 'close-floating';
        closeBtn.innerHTML = '✕';
        closeBtn.onclick = (e) => {
            e.stopPropagation();
            disableFloatingMode();
        };
        chatScreen.appendChild(closeBtn);
        
        chatHeader.style.cursor = 'move';
        chatHeader.addEventListener('mousedown', startDrag);
        chatHeader.addEventListener('touchstart', startDrag);
        
        isFloating = true;
        floatingToggle.classList.add('hidden');
        chatScreen.classList.remove('hidden');
    }

    function disableFloatingMode() {
        if (!isFloating) return;
        chatScreen.classList.remove('floating-mode');
        if (originalParent) originalParent.appendChild(chatScreen);
        chatScreen.style.position = '';
        chatScreen.style.bottom = '';
        chatScreen.style.right = '';
        
        const closeBtn = chatScreen.querySelector('.close-floating');
        if (closeBtn) closeBtn.remove();
        
        chatHeader.style.cursor = '';
        chatHeader.removeEventListener('mousedown', startDrag);
        chatHeader.removeEventListener('touchstart', startDrag);
        
        isFloating = false;
        floatingToggle.classList.remove('hidden');
        chatScreen.classList.add('hidden');
    }

    function startDrag(e) {
        isDragging = true;
        const rect = chatScreen.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        dragOffsetX = clientX - rect.left;
        dragOffsetY = clientY - rect.top;
        
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchmove', onDrag);
        document.addEventListener('touchend', stopDrag);
    }

    function onDrag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        let newLeft = clientX - dragOffsetX;
        let newTop = clientY - dragOffsetY;
        
        newLeft = Math.max(0, Math.min(window.innerWidth - chatScreen.offsetWidth, newLeft));
        newTop = Math.max(0, Math.min(window.innerHeight - chatScreen.offsetHeight, newTop));
        
        chatScreen.style.left = newLeft + 'px';
        chatScreen.style.top = newTop + 'px';
        chatScreen.style.right = 'auto';
        chatScreen.style.bottom = 'auto';
    }

    function stopDrag() {
        isDragging = false;
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('touchend', stopDrag);
    }

    function toggleFloating() {
        if (isFloating) disableFloatingMode();
        else enableFloatingMode();
    }

    // ==================== INICIAR CHAT ====================
    function startChat() {
        welcomeScreen.classList.add('hidden');
        nameScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
        floatingToggle.classList.remove('hidden');
        userNameDisplay.textContent = userName;
        chatAvatar.textContent = '🌿';
        cargarHistorial();
        if (historialCompleto.length === 0) {
            setTimeout(() => {
                addMessage('bot', `✨ Hola ${userName}. Soy TuKompa. Usá 🌀 para modo flotante.`, true);
                messageInput.focus();
            }, 500);
        }
    }

    function loadSavedSession() {
        const saved = localStorage.getItem('tuKompa_userName');
        if (saved) {
            userName = saved;
            startChat();
            return true;
        }
        return false;
    }

    // ==================== EVENTOS ====================
    startBtn.onclick = () => {
        welcomeScreen.classList.add('hidden');
        nameScreen.classList.remove('hidden');
        document.getElementById('userNameInput').focus();
    };
    
    confirmNameBtn.onclick = () => {
        const name = document.getElementById('userNameInput').value.trim();
        if (!name) {
            alert('Por favor, ingresá tu nombre');
            return;
        }
        userName = name;
        localStorage.setItem('tuKompa_userName', userName);
        startChat();
    };
    
    sendBtn.onclick = sendMessage;
    
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    
    voiceBtn.onclick = toggleVoice;
    floatingBtn.onclick = toggleFloating;
    floatingToggle.onclick = toggleFloating;
    
    logoutBtn.onclick = () => {
        if (confirm('¿Cerrar sesión? Tus conversaciones quedan guardadas.')) {
            if (recognition) recognition.stop();
            if (isFloating) disableFloatingMode();
            userName = '';
            historialCompleto = [];
            messagesArea.innerHTML = '';
            localStorage.removeItem('tuKompa_userName');
            welcomeScreen.classList.remove('hidden');
            chatScreen.classList.add('hidden');
            floatingToggle.classList.add('hidden');
            document.getElementById('userNameInput').value = '';
        }
    };

    // ==================== INICIALIZAR ====================
    updateConnectionStatus();
    if (!loadSavedSession()) {
        welcomeScreen.classList.remove('hidden');
        nameScreen.classList.add('hidden');
        chatScreen.classList.add('hidden');
        floatingToggle.classList.add('hidden');
    }
</script>
</body>
</html>
